name: Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-image-tags compares with the base commit
      # Every shell script in templates/, found by its shebang or shellcheck directive.
      - run: |
          mapfile -t template_scripts < <(grep -rlE '^#!/(usr/)?bin/(env )?(ba)?sh|^# shellcheck shell=' templates)
          shellcheck --severity=warning scripts/* tests/* images/*/validate images/*/entrypoint "${template_scripts[@]}"
      - name: Renovate annotations are readable
        run: tests/renovate
      - name: Changed images have a new tag
        if: github.event_name != 'workflow_dispatch'
        run: tests/check-image-tags && scripts/check-image-tags "${{ github.event.pull_request.base.sha || github.event.before }}"

  images:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the eonax step compares with the base commit

      # GHCR publishing is disabled unless the repository variable PUBLISH_IMAGES is "true".
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate and (if publishing is enabled) push every image
        env:
          PUSH: ${{ github.event_name != 'pull_request' && vars.PUBLISH_IMAGES == 'true' }}
        run: |
          set -euo pipefail
          for dir in images/*/; do
            dir="${dir%/}"
            IMAGE=""
            source "$dir/image.env"
            docker build -t "$IMAGE" "$dir"
            if [[ -x "$dir/validate" ]]; then "$dir/validate" "$IMAGE"; fi
            if [[ "$PUSH" == "true" ]]; then docker push "$IMAGE"; fi
          done

      - name: new-project behavior tests
        run: tests/new-project

      - name: dev behavior tests
        run: tests/dev

      - name: Full data space test of eonax (only when something it uses changed)
        if: github.event_name != 'workflow_dispatch'
        env:
          PROJECTS_DIR: ${{ runner.temp }}/projects
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # The template, plus what every project goes through: shared files, scripts, images, this workflow.
          uses=(templates/eonax templates/_shared scripts images .github/workflows/images.yml)
          if git diff --quiet "$base" -- "${uses[@]}"; then echo "nothing eonax uses changed: skipped"; exit 0; fi
          scripts/new-project eonax ci-eonax-full
          cd "$PROJECTS_DIR/ci-eonax-full"
          "$GITHUB_WORKSPACE/scripts/dev" exec just test
          "$GITHUB_WORKSPACE/scripts/dev" down
          # The deploy profile: the hosted data space, from scratch, then its checks.
          deploy/init
          HTTPS_PORT=8443 HTTP_PORT=8081 deploy/up
          HTTPS_PORT=8443 deploy/check
          deploy/down

      - name: Generate and start a project from every template
        env:
          PROJECTS_DIR: ${{ runner.temp }}/projects
        run: |
          set -euo pipefail
          for dir in templates/*/; do
            [[ -d "$dir/scaffold" ]] || continue  # templates/_shared is not a template
            name="$(basename "$dir")"
            scripts/new-project "$name" "ci-$name"
            # Stop it before the next template: they all publish port 3000.
            (cd "$PROJECTS_DIR/ci-$name" && "$GITHUB_WORKSPACE/scripts/dev" exec just --list && "$GITHUB_WORKSPACE/scripts/dev" down)
          done
