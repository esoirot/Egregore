[versions]
edc = "0.18.1"
junit = "6.1.3"

[libraries]
edc-bom-controlplane = { module = "org.eclipse.edc:controlplane-base-bom", version.ref = "edc" }
edc-bom-controlplane-sql = { module = "org.eclipse.edc:controlplane-feature-sql-bom", version.ref = "edc" }
edc-bom-dataplane = { module = "org.eclipse.edc:dataplane-base-bom", version.ref = "edc" }
edc-bom-dataplane-sql = { module = "org.eclipse.edc:dataplane-feature-sql-bom", version.ref = "edc" }
edc-data-plane-spi = { module = "org.eclipse.edc:data-plane-spi", version.ref = "edc" }
edc-web-spi = { module = "org.eclipse.edc:web-spi", version.ref = "edc" }
edc-jetty-core = { module = "org.eclipse.edc:jetty-core", version.ref = "edc" }
jetty-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version = "12.1.9" } # the one EDC's jetty-core uses
edc-participant-context-config = { module = "org.eclipse.edc:participant-context-config-core", version.ref = "edc" }
edc-vault-hashicorp = { module = "org.eclipse.edc:vault-hashicorp", version.ref = "edc" }
edc-transfer-data-plane-signaling = { module = "org.eclipse.edc:transfer-data-plane-signaling", version.ref = "edc" }

# Identity and trust (DCP): control plane, Identity Hub, Issuer Service
edc-bom-controlplane-dcp = { module = "org.eclipse.edc:controlplane-dcp-bom", version.ref = "edc" }
edc-cel-api = { module = "org.eclipse.edc:cel-api-v5", version.ref = "edc" }
edc-cel-core = { module = "org.eclipse.edc:cel-core", version.ref = "edc" }
edc-cel-dcp = { module = "org.eclipse.edc:decentralized-claims-cel", version.ref = "edc" }
edc-cel-store-sql = { module = "org.eclipse.edc:cel-store-sql", version.ref = "edc" }
edc-bom-identityhub = { module = "org.eclipse.edc:identityhub-bom", version.ref = "edc" }
edc-bom-identityhub-sql = { module = "org.eclipse.edc:identityhub-feature-sql-bom", version.ref = "edc" }
edc-bom-issuerservice = { module = "org.eclipse.edc:issuerservice-bom", version.ref = "edc" }
edc-bom-issuerservice-sql = { module = "org.eclipse.edc:issuerservice-feature-sql-bom", version.ref = "edc" }
edc-issuance-spi = { module = "org.eclipse.edc:issuerservice-issuance-spi", version.ref = "edc" }
edc-participant-context-spi = { module = "org.eclipse.edc:participant-context-spi", version.ref = "edc" }
edc-crawler-spi = { module = "org.eclipse.edc:crawler-spi", version.ref = "edc" }
edc-identity-did-spi = { module = "org.eclipse.edc:identity-did-spi", version.ref = "edc" }
edc-did-api = { module = "org.eclipse.edc:did-api", version.ref = "edc" }
edc-participant-context-api = { module = "org.eclipse.edc:participant-context-api", version.ref = "edc" }
edc-participant-context-config-store-sql = { module = "org.eclipse.edc:participantcontext-config-store-sql", version.ref = "edc" }

# Gaia-X compliance client (gaiax/)
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "10.10" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.86" }

# Tests (gradle test, run by just test)
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
