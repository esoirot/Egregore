name: {{PROJECT_NAME}}

services:
  dev:
    image: {{IMAGE}}
    working_dir: /workspace
    # .env reaches every process in the container, not only just recipes (dev down && dev up after edits).
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    command: sleep infinity
    init: true
